[workspace]
members = ["crates/echofiber-cli", "crates/echofiber-core"]
resolver = "3"

[workspace.package]
authors = ["EchoFiber contributors"]
edition = "2024"
homepage = "https://github.com/tradicije/echofiber"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tradicije/echofiber"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
